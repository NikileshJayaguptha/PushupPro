services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pushup
      POSTGRES_PASSWORD: pushup
      POSTGRES_DB: pushuppro
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pushup -d pushuppro"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://pushup:pushup@db:5432/pushuppro
      CORS_ORIGINS: http://localhost:3000
      MAX_UPLOAD_MB: "500"
    volumes:
      - videos:/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  videos:
